<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Grid - Searchable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
            color: #58a6ff;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background-color: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #8b949e;
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 14px;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .clear-btn {
            padding: 8px 16px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-end;
        }

        .clear-btn:hover {
            background-color: #30363d;
        }

        .table-container {
            overflow-x: auto;
            background-color: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #21262d;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #c9d1d9;
            border-bottom: 1px solid #30363d;
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
        }

        tr:hover {
            background-color: #1c2128;
        }

        .difficulty {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .difficulty.easy {
            background-color: rgba(46, 160, 67, 0.15);
            color: #3fb950;
        }

        .difficulty.medium {
            background-color: rgba(187, 128, 9, 0.15);
            color: #d29922;
        }

        .difficulty.hard {
            background-color: rgba(248, 81, 73, 0.15);
            color: #f85149;
        }

        .no-results {
            padding: 40px;
            text-align: center;
            color: #8b949e;
        }

        .task-number {
            font-weight: 600;
            color: #58a6ff;
        }

        .results-count {
            margin-bottom: 15px;
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Task Grid</h1>
        
        <div class="filters">
            <div class="filter-group">
                <label for="taskNumber">Task Number</label>
                <input type="text" id="taskNumber" placeholder="e.g., 1, 2, 3...">
            </div>
            
            <div class="filter-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Search description...">
            </div>
            
            <div class="filter-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="">All Difficulties</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="Search location...">
            </div>
            
            <div class="filter-group">
                <label for="notes">Notes</label>
                <input type="text" id="notes" placeholder="Search notes...">
            </div>
            
            <div class="filter-group">
                <label>&nbsp;</label>
                <button class="clear-btn" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>

        <div class="results-count" id="resultsCount"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Task #</th>
                        <th>Description</th>
                        <th>Difficulty</th>
                        <th>Location</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- Rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sample data - Replace this with your actual tasks
        const tasks = [
            { number: 1, description: "Implement binary search algorithm", difficulty: "easy", location: "algorithms/search.py", notes: "Use iterative approach" },
            { number: 2, description: "Create REST API endpoint for user authentication", difficulty: "medium", location: "api/auth.js", notes: "Include JWT token generation" },
            { number: 3, description: "Optimize database query performance", difficulty: "hard", location: "database/queries.sql", notes: "Add proper indexes" },
            { number: 4, description: "Write unit tests for payment module", difficulty: "medium", location: "tests/payment_test.py", notes: "Cover edge cases" },
            { number: 5, description: "Fix CSS layout issues on mobile", difficulty: "easy", location: "styles/mobile.css", notes: "Use flexbox" },
            { number: 6, description: "Implement caching layer with Redis", difficulty: "hard", location: "cache/redis_client.py", notes: "Set TTL to 3600s" },
            { number: 7, description: "Add form validation to signup page", difficulty: "easy", location: "components/SignupForm.jsx", notes: "Email and password validation" },
            { number: 8, description: "Refactor legacy code in payment processor", difficulty: "hard", location: "services/payment.js", notes: "Maintain backward compatibility" },
            { number: 9, description: "Create data visualization dashboard", difficulty: "medium", location: "dashboard/charts.js", notes: "Use Chart.js library" },
            { number: 10, description: "Set up CI/CD pipeline", difficulty: "medium", location: ".github/workflows/deploy.yml", notes: "Deploy to staging first" }
        ];

        let filteredTasks = [...tasks];

        function renderTable() {
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = '';

            if (filteredTasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-results">No tasks found matching your filters</td></tr>';
                updateResultsCount(0);
                return;
            }

            filteredTasks.forEach(task => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="task-number">#${task.number}</span></td>
                    <td>${task.description}</td>
                    <td><span class="difficulty ${task.difficulty.toLowerCase()}">${task.difficulty}</span></td>
                    <td>${task.location}</td>
                    <td>${task.notes}</td>
                `;
                tbody.appendChild(row);
            });

            updateResultsCount(filteredTasks.length);
        }

        function updateResultsCount(count) {
            const resultsCount = document.getElementById('resultsCount');
            resultsCount.textContent = `Showing ${count} of ${tasks.length} tasks`;
        }

        function filterTasks() {
            const taskNumber = document.getElementById('taskNumber').value.toLowerCase();
            const description = document.getElementById('description').value.toLowerCase();
            const difficulty = document.getElementById('difficulty').value.toLowerCase();
            const location = document.getElementById('location').value.toLowerCase();
            const notes = document.getElementById('notes').value.toLowerCase();

            filteredTasks = tasks.filter(task => {
                return (
                    (taskNumber === '' || task.number.toString().includes(taskNumber)) &&
                    (description === '' || task.description.toLowerCase().includes(description)) &&
                    (difficulty === '' || task.difficulty.toLowerCase() === difficulty) &&
                    (location === '' || task.location.toLowerCase().includes(location)) &&
                    (notes === '' || task.notes.toLowerCase().includes(notes))
                );
            });

            renderTable();
        }

        function clearFilters() {
            document.getElementById('taskNumber').value = '';
            document.getElementById('description').value = '';
            document.getElementById('difficulty').value = '';
            document.getElementById('location').value = '';
            document.getElementById('notes').value = '';
            filteredTasks = [...tasks];
            renderTable();
        }

        // Add event listeners to all filter inputs
        document.getElementById('taskNumber').addEventListener('input', filterTasks);
        document.getElementById('description').addEventListener('input', filterTasks);
        document.getElementById('difficulty').addEventListener('change', filterTasks);
        document.getElementById('location').addEventListener('input', filterTasks);
        document.getElementById('notes').addEventListener('input', filterTasks);

        // Initial render
        renderTable();
    </script>
</body>
</html>
