name: Update LeetCode README

on:
  push:
    paths:
      - '2026/**' # Only runs when you add/change files in the 2026 folder
  workflow_dispatch: # Allows you to run it manually from the "Actions" tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Gives the bot permission to edit your README

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run README generator
        run: python generate_readme.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if there are actually changes to the README
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update README with new solutions" && git push)